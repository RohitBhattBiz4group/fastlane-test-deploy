name: iOS - Deploy to TestFlight (develop)

on:
  push:
    branches:
      - develop

jobs:
  build_and_deploy:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: ios

      - name: Install Pods
        run: bundle exec pod install
        working-directory: ios

      - name: Create App Store Connect API Key file
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: echo "$APP_STORE_CONNECT_API_KEY_P8" > ios/AuthKey.p8

      - name: Build & Upload to TestFlight
        run: bundle exec fastlane beta
        working-directory: ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTH: ${{ secrets.MATCH_GIT_BASIC_AUTH }}
          KEY_ID: ${{ secrets.KEY_ID }}
          ISSUER_ID: ${{ secrets.ISSUER_ID }}

      - name: Clean up secrets
        if: always()
        run: rm -f ios/AuthKey.p8